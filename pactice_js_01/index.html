<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>動きのあるサイト</title>
  <link rel="stylesheet" href="css/destyle.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo">
      <a href="/">株式会社ロゴ</a>
    </div>
    <button class="menu_button">
      <img src="img/menu_btn.svg" alt="メニューボタン" width="30" height="30">
    </button>
    <nav class="pc_nav">
      <ul class="main_menu">
        <li><a href="#">サービス</a></li>
        <li><a href="#">アクセス</a></li>
        <li><a href="#">お問い合わせ</a></li>
      </ul>
    </nav>
    <nav class="sp_nav">
      <ul class="main_menu">
        <li><a href="#">サービス</a></li>
        <li><a href="#">アクセス</a></li>
        <li><a href="#">お問い合わせ</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1 class="title">長めのタイトルをここに表示させてみます</h1>
    <button id="color_btn">色変更</button>
    <p>氏名：<span id="name">花子</span></p>
    <div id="members"></div>
    <h2>メンバー表</h2>
    <ul class="member_list" id="member_list">
      
    </ul>

    <h2 style="font-size: 30px;">クラスの名簿</h2>
    <div>
      <p>1番：山田太郎</p>
      <p>2番：髙橋二郎</p>
    </div>

    <h2 style="font-size: 30px;">チームメンバー表</h2>
    <table class="team_member" id="member_table">
      <tr>
        <th>背番号</th>
        <th>名前</th>
        <th>ポジション</th>
      </tr>
    </table>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
